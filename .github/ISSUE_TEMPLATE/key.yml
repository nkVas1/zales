name: Ключ не подключается
description: Тропа не открывается или обрывается
labels: ["туннель"]
body:
  - type: markdown
    attributes:
      value: |
        Сначала — **Настройки → «Проверить тропу»**. Приложение пройдёт по шагам и
        скажет одной фразой, где споткнулись. Внизу этой проверки есть кнопка
        «Скопировать»: в скопированном тексте есть всё, что нужно для разбора, и
        **нет ни ключа, ни пароля** — его можно вставлять сюда целиком.

  - type: textarea
    id: report
    attributes:
      label: Технический отчёт
      description: Из «Проверки тропы», кнопка «Скопировать». Вставьте как есть.
      render: text
    validations:
      required: true

  - type: input
    id: what
    attributes:
      label: Что происходит на экране
      placeholder: 'Например: «рубильник поднимается, потом падает обратно, пишет «Не прошли»»'
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Где это происходит
      multiple: true
      options:
        - Домашний Wi-Fi
        - Мобильный интернет
        - Чужой Wi-Fi (работа, кафе, гостиница)
        - Везде
    validations:
      required: true

  - type: input
    id: before
    attributes:
      label: Раньше работало?
      placeholder: 'Например: «работало вчера», «никогда не работало», «работает через раз»'
