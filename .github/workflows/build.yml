name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # A tampered wrapper jar would run arbitrary code on every clone.
      # For a VPN client that check is not optional.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # The runner ships an Android SDK, but not necessarily the exact platform
      # pinned in gradle/libs.versions.toml.
      - name: Install pinned Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0"

      # The Go artefact is large and slow to build; key the cache on its sources.
      - name: Cache the native core
        id: native-core
        uses: actions/cache@v4
        with:
          path: native/prebuilt
          key: zales-core-${{ runner.os }}-${{ hashFiles('native/core/**', 'native/build_core.py') }}

      - name: Set up Go
        if: steps.native-core.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: native/core/go.mod
          cache-dependency-path: native/core/go.sum

      - name: Build the native core
        if: steps.native-core.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          PATH="$(go env GOPATH)/bin:$PATH" python3 native/build_core.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # A string added in one language and not the other falls back silently,
      # and the only person who finds out is the one reading the wrong language.
      - name: Both languages say the same things
        run: python3 tools/check_translations.py

      - name: Static analysis
        run: ./gradlew detekt lint --no-daemon

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble release
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: zales-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
          retention-days: 7
